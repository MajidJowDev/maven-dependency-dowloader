name: Maven Dependency Downloader

on:
  workflow_dispatch:
    inputs:
      pom_content:
        description: 'Content of pom.xml file'
        required: true
        type: string
      target_directory:
        description: 'Directory to store dependencies'
        required: false
        default: '.github/dependencies'
        type: string

jobs:
  download-dependencies:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Create temporary pom.xml
        run: |
          cat > pom.xml << 'EOF'
          ${{ inputs.pom_content }}
          EOF
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Create dependencies directory
        run: mkdir -p ${{ inputs.target_directory }}
      
      - name: Download full offline Maven repository
        run: |
          echo "📥 Downloading all dependencies, plugins, plugin dependencies, parent POMs, and metadata..."
          
          # Use target directory as Maven local repository
          mvn dependency:go-offline \
            -Dmaven.repo.local=${{ inputs.target_directory }}
          
          echo "✅ Complete offline Maven repository downloaded"
      
      - name: Install 7zip
        run: sudo apt-get update && sudo apt-get install -y p7zip-full
      
      - name: Create and split 7zip archive
        run: |
          echo "📦 Creating compressed archive..."
          7z a -t7z -m0=lzma2 -mx=9 -mfb=64 -md=32m -ms=on \
            -v95m \
            maven-dependencies.7z \
            ${{ inputs.target_directory }}
          
          echo "✅ Archive created and split into chunks"
          
          # Move all archive parts to target directory
          mv maven-dependencies.7z.* ${{ inputs.target_directory }}/ 2>/dev/null || true
          mv maven-dependencies.7z ${{ inputs.target_directory }}/ 2>/dev/null || true
          
          # List created files
          echo "📋 Archive parts:"
          ls -lh ${{ inputs.target_directory }}/maven-dependencies.7z*
      
      - name: Remove unzipped files
        run: |
          echo "🗑️ Removing unzipped dependency files..."
          
          # Find and store paths, then delete
          find ${{ inputs.target_directory }} -mindepth 1 \
            ! -name "maven-dependencies.7z*" \
            -print0 | xargs -0 rm -rf
          
          echo "✅ Unzipped files removed, only archive parts remain"
      
      - name: Create extraction instructions
        run: |
          cat > ${{ inputs.target_directory }}/README.md << 'EOF'
          # Maven Dependencies Archive
          
  
