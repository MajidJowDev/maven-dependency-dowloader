name: Maven Dependency Downloader

on:
  workflow_dispatch:
    inputs:
      pom_content:
        description: 'Content of pom.xml file'
        required: true
        type: string
      target_directory:
        description: 'Directory to store dependencies (e.g., .github/dependencies)'
        required: true
        default: '.github/dependencies'
        type: string

jobs:
  download-dependencies:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install 7zip
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full

      - name: Create target directory
        run: |
          mkdir -p ${{ inputs.target_directory }}

      - name: Create pom.xml from input
        run: |
          echo "${{ inputs.pom_content }}" > pom.xml
          echo "✅ pom.xml created"
          cat pom.xml

      - name: Download all dependencies and plugins
        run: |
          echo "📥 Downloading complete offline Maven repository..."
          
          mvn dependency:go-offline \
            -Dmaven.repo.local=${{ inputs.target_directory }}
          
          echo "✅ Download complete"
          
          echo "📊 Repository size:"
          du -sh ${{ inputs.target_directory }}

      - name: Create and split 7zip archive
        run: |
          echo "📦 Creating compressed archive..."

          mkdir -p /tmp/maven-archive

          # Archive the contents of the target directory, not the directory itself
          cd ${{ inputs.target_directory }}
          7z a \
            -t7z \
            -m0=lzma2 \
            -mx=9 \
            -mfb=64 \
            -md=32m \
            -ms=on \
            -v95m \
            /tmp/maven-archive/maven-dependencies.7z \
            .

          echo "✅ Archive created"

          echo "📋 Archive parts:"
          ls -lh /tmp/maven-archive/

      - name: Remove unzipped files and copy archive
        run: |
          echo "🗑️ Removing original dependency files..."

          # Remove all contents of target directory
          rm -rf ${{ inputs.target_directory }}/*

          # Copy archive parts back
          cp /tmp/maven-archive/* ${{ inputs.target_directory }}/

          echo "✅ Only archive parts remain"

          ls -lh ${{ inputs.target_directory }}

      - name: Create extraction guide
        run: |
          cat > ${{ inputs.target_directory }}/README.md << 'EOF'
          # Maven Dependencies Archive

          This directory contains a complete offline Maven repository archive.

          ## Contents
          - Split 7zip archive files (`maven-dependencies.7z.001`, `.002`, etc.)
          - All dependencies, plugins, and metadata needed for offline builds

          ## How to Extract

          ### Prerequisites
          Install 7zip:
          - **Linux/macOS**: `sudo apt-get install p7zip-full` or `brew install p7zip`
          - **Windows**: Download from https://www.7-zip.org/

          ### Extraction

