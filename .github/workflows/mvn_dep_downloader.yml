name: Maven Dependency Downloader

on:
  workflow_dispatch:
    inputs:
      pom_content:
        description: 'Content of pom.xml file'
        required: true
        type: string
      target_directory:
        description: 'Directory to store dependencies'
        required: false
        default: '.github/dependencies'
        type: string

jobs:
  download-dependencies:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Create temporary pom.xml
        run: |
          cat > pom.xml << 'EOF'
          ${{ inputs.pom_content }}
          EOF
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Create dependencies directory
        run: mkdir -p ${{ inputs.target_directory }}
      
      - name: Download dependencies with repository structure
        run: |
          echo "📥 Downloading dependencies with Maven repository layout..."
          
          mvn dependency:copy-dependencies \
            -DoutputDirectory=${{ inputs.target_directory }} \
            -Dmdep.useRepositoryLayout=true \
            -Dmdep.copyPom=true \
            -Dmdep.addParentPoms=true \
            -DincludeScope=runtime
          
          echo "✅ Dependencies downloaded with repository structure"
      
      - name: Install 7zip
        run: sudo apt-get update && sudo apt-get install -y p7zip-full
      
      - name: Create 7zip archive
        run: |
          7z a -t7z -m0=lzma2 -mx=9 -mfb=64 -md=32m -ms=on \
            maven-dependencies.7z \
            ${{ inputs.target_directory }}
          
          archive_size=$(du -h maven-dependencies.7z | cut -f1)
          echo "📦 Archive created: maven-dependencies.7z (${archive_size})"
          
          mv maven-dependencies.7z ${{ inputs.target_directory }}/
      
      - name: Remove unzipped files
        run: |
          echo "🗑️ Removing unzipped dependency files..."
          find ${{ inputs.target_directory }} -type f ! -name "*.7z" -delete
          find ${{ inputs.target_directory }} -type d -empty -delete
          echo "✅ Unzipped files removed, only archive remains"
      
      - name: Commit dependencies
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add ${{ inputs.target_directory }}
          git diff --staged --quiet || git commit -m "Add Maven dependencies archive [skip ci]"
          git push
